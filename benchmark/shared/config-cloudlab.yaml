# Environment config — copy to shared/config.yaml and adjust for your setup.
# This variant targets cloudlab setup.

registry: "10.10.1.2:5000"

# Path to the 2dfs home directory. Used for cache clearing and passed as --home-dir to tdfs.
# null = don't pass --home-dir (tdfs uses its default).
tdfs_home_dir: "/mydata/.2dfs"

# TMPDIR for tdfs. null = use system default.
tmpdir: "/mydata/tmp"

# Filesystem the workload writes to; resource_monitor reports disk_usage for its mount.
# null = root ("/"). Use on nodes where data lives on a separate volume (e.g. "/mydata").
data_volume: "/mydata"

# HF_HOME - HuggingFace cache/download location.
# null = don't set it (HuggingFace uses its default ~/.cache/huggingface).
hf_home: "/mydata/huggingface"

# tdfs binary.
# "./tdfs" means relative to the calling script's directory (local dev binary).
# "tdfs"   means global binary on PATH.
tdfs_binary: "tdfs"

# Seconds to idle between runs so the machine settles before the next measurement.
build_cooldown: 5
pull_cooldown: 5

# build_performance/measure.py
build_n_runs: 3
# Sample resource usage during builds and produce resource charts.
build_with_resource: true

# build_performance/measure_rebuild.py
rebuild_n_runs: 3

# pull_performance/measure.py
pull_n_runs: 3

# pull_performance/measure_refresh.py
refresh_n_runs: 3
